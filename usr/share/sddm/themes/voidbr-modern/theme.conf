[General]
# Imagem de fundo (relativa à pasta do tema ou caminho absoluto)
background=Assets/background.jpg
# Véu escuro sobre o fundo, para contraste (0 a 1)
dimOpacity=0.45
# Cor de destaque (foco, avatar, botão de entrar)
accent=#cfbcff
# Cor do texto/ícone sobre a cor de destaque
onAccent=#21005d
# Fonte (cai na padrão do sistema se não existir)
fontFamily=Noto Sans
# Formato da hora (Qt) e locale da data
clockFormat=HH:mm
dateLocale=pt_BR
