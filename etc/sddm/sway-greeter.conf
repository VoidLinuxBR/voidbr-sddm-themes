# VoidBR: sway usado só como compositor do greeter do SDDM (tela de login).
# Substitui o weston (padrão do sddm), que em VM (virtio-gpu) deixava o
# cursor invisível. Depois do login o sddm encerra este sway e inicia a
# sessão escolhida com o compositor dela (Hyprland, labwc/XFCE, Xorg...).
# Referenciado em /etc/sddm.conf.d/wayland.conf (CompositorCommand).
xwayland disable
default_border none
input type:keyboard xkb_layout br
