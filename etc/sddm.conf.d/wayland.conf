# VoidBR: greeter do SDDM em modo Wayland (dom 22 nov 2026)
# - As ISOs Wayland puro (Hyprland, Sway, Mango, labwc) não têm xorg; com o
#   greeter em X11 (padrão do sddm) o SDDM sobe em tela preta.
# - Em modo Wayland o greeter funciona com ou sem xorg, em todas as ISOs.
#   O Xorg só sobe depois do login, se a sessão escolhida for X11.
# - Compositor do greeter: sway (config em /etc/sddm/sway-greeter.conf), no
#   lugar do weston padrão do sddm ("weston --shell=kiosk"), que em VM
#   (virtio-gpu) deixava o cursor invisível. WLR_NO_HARDWARE_CURSORS=1 força
#   o cursor por software; vale só para a tela de login.
# - Cursor do greeter: adwaita-icon-theme (ver cursor.conf).
[General]
DisplayServer=wayland

[Wayland]
CompositorCommand=env WLR_NO_HARDWARE_CURSORS=1 sway -c /etc/sddm/sway-greeter.conf
