# VoidBR: greeter do SDDM em modo Wayland (dom 22 nov 2026)
# - As ISOs Wayland puro (Hyprland, Sway, Mango, labwc) não têm xorg; com o
#   greeter em X11 (padrão do sddm) o SDDM sobe em tela preta.
# - Em modo Wayland o greeter funciona com ou sem xorg, em todas as ISOs.
# - Sem CompositorCommand, o sddm usa o weston como compositor do greeter;
#   por isso weston está no depends do voidbr-sddm-themes (junto com o
#   adwaita-icon-theme, cursor definido em cursor.conf).
# - Em VM o cursor pode ficar invisível no greeter Wayland (problema
#   conhecido com o tablet USB emulado pelo QEMU); em máquina real não ocorre.
[General]
#CompositorCommand=weston --shell=kiosk
DisplayServer=wayland
